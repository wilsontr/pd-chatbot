name: Skill eval gate

# A skill is a deployable unit: its golden slice must pass before its version is
# activated (skills/activation.json) and served. This workflow runs the slice for
# every skill a pull request changes, gates it, and commits the activation and
# the updated per-skill report (docs/SKILLS.md) back to the PR branch.
#
# A failed slice fails the job and leaves that skill's pin untouched, so the
# previously activated snapshot keeps serving — the rollback is simply "not
# activating". Skills that pass in the same run are still activated and
# committed. A direct push to main that skips this workflow leaves the changed
# skill serving its previously activated version (or not serving at all if it is
# new); run the job manually from the Actions tab to publish it. A manual run
# commits its activations to the branch it ran on (main included).
#
# Each activation made here records this run (metrics.ci in the manifest).
# skills-check.yml fails main when a pin has no such evidence (TASK-5.37).
#
# Cost: one agent run plus three judge calls per answer, about $0.013 measured
# (run 46093371333). Each slice is 15+ questions answered 3 times and pooled
# (TASK-5.40), so ~45 answers and ~$0.60 per changed skill; a manual run of all
# six skills is ~$3.60. Only changed skills run on a pull request.

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'agent/skills/**'
      - 'agent/tools/skills.py'
      - 'evaluation/skills.py'
      - 'evaluation/gates.py'
      - '.github/workflows/skills.yml'
  workflow_dispatch:
    inputs:
      skills:
        description: 'Comma-separated skill names (empty = every installed skill)'
        type: string
        default: ''

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-eval:
    runs-on: ubuntu-latest
    # ~45 answers per skill; all six skills at once take the longest.
    timeout-minutes: 60
    # Needed to commit the activation and snapshot back to the PR branch.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The diff against the base branch needs history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build ChromaDB index (embeddings must be precomputed)
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: python embed_and_index.py

      - name: Determine which skills changed
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
          INPUT_SKILLS: ${{ github.event.inputs.skills }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_SKILLS:-}" ]]; then
            skills="$INPUT_SKILLS"
            mode="--skills"
            run="true"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch -q --no-tags origin "$BASE_REF"
            skills=$(git diff --name-only "origin/$BASE_REF...HEAD" -- skills/ \
              | awk -F/ 'NF >= 3 && $2 !~ /^\./ && $2 != "activation.json" && $2 != "README.md" { print $2 }' \
              | sort -u | paste -sd, -)
            mode="--skills"
            [[ -n "$skills" ]] && run="true" || run="false"
          else
            skills=""
            mode="--all"
            run="true"
          fi
          {
            echo "skills=$skills"
            echo "mode=$mode"
            echo "run=$run"
          } >> "$GITHUB_OUTPUT"
          echo "Changed skills: ${skills:-every installed skill}"

      - name: Run the skill slices (gated)
        if: steps.changed.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SKILL_MODE: ${{ steps.changed.outputs.mode }}
          SKILL_NAMES: ${{ steps.changed.outputs.skills }}
        run: |
          set -euo pipefail
          if [[ "$SKILL_MODE" == "--all" ]]; then
            selection=(--all)
          else
            selection=(--skills "$SKILL_NAMES")
          fi
          python -m evaluation.skills \
            "${selection[@]}" \
            --trials 3 \
            --gate --activate \
            --report docs/SKILLS.md \
            --output skills_eval.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the per-question results
        # always(): a failed slice's JSON is the evidence for why it failed.
        if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval
          path: skills_eval.json

      # Committing back only works for branches in this repository; a pull
      # request from a fork cannot push with GITHUB_TOKEN, and the job fails
      # with a clear "denied" message rather than silently skipping activation.
      # always(): skills that passed are committed even when another one failed.
      - name: Commit the activation and report
        if: always() && steps.changed.outputs.run == 'true'
        env:
          TARGET: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add skills/activation.json docs/SKILLS.md
          if [[ -d skills/.activated ]]; then
            git add skills/.activated
          fi
          if git diff --cached --quiet; then
            echo "No activation change to commit"
            exit 0
          fi
          git commit -m 'ci: activate evaluated skill versions [skip ci]'
          # A gate run takes up to an hour; main often moves meanwhile (the eval
          # bot publishes EVAL.md). Re-apply onto the branch tip and retry rather
          # than losing activations that were paid for.
          # Only the activation commit is applied, so a pull request's merge
          # checkout never pushes main's commits onto the PR branch.
          activation=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            git fetch -q origin "$TARGET"
            git checkout -q --detach FETCH_HEAD
            git cherry-pick "$activation" >/dev/null
            if git push origin "HEAD:$TARGET"; then exit 0; fi
            echo "push rejected (attempt $attempt)"
          done
          echo "::error::could not push the activation to $TARGET"
          exit 1
