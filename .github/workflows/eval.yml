name: Evaluation

on:
  push:
    branches: [main]
    # Nothing here changes what the evaluation measures, and each run costs money.
    paths-ignore: ['backlog/**', '**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sample:
        description: 'Number of generation samples'
        type: string
        default: '10'
      # 3 or more trials writes docs/EVAL_BASELINE.md, the agent-vs-pipeline
      # baseline the README cites (TASK-5.38); fewer writes the routine EVAL.md.
      trials:
        description: 'Trials per arm (3+ with sample 30 = a new published baseline, EVAL_BASELINE.md; each trial costs money)'
        type: string
        default: '1'

# Prevent concurrent eval runs on the same branch from racing each
# other when publishing EVAL.md. Pushes made by anyone else during a
# run are handled by .github/scripts/publish_eval.sh.
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    # A single-trial sampled run finishes in a few minutes; the published
    # 30-entry x 3-trial baseline (sample=30, trials=3, dispatched manually)
    # takes ~50 minutes, so the timeout follows the trials input.
    timeout-minutes: ${{ (github.event.inputs.trials || '1') == '1' && 20 || 120 }}
    permissions:
      contents: write  # needed for auto-commit of EVAL.md

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Build ChromaDB index (embeddings must be precomputed)
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          python embed_and_index.py

      # PRs already get a sampled generation gate from generation-eval.yml when
      # they touch prompts or evaluation/**, so this path stays retrieval-only.
      - name: Run retrieval evaluation (pull request)
        if: github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          python -m evaluation.evaluate --retrieval --report docs/EVAL.md --quiet

      # main / manual: retrieval plus a cost-bounded generation sample, so the
      # published report carries current generation numbers and a regression on
      # main fails the build instead of silently degrading answers.
      # A routine run (push, or dispatch with 1-2 trials) rewrites docs/EVAL.md;
      # only a dispatch with 3+ trials rewrites the baseline. A push can never
      # overwrite the baseline the README cites.
      - name: Choose the report
        id: report
        env:
          TRIALS: ${{ github.event.inputs.trials || '1' }}
        run: |
          if [[ "$TRIALS" -ge 3 ]]; then
            echo "path=docs/EVAL_BASELINE.md" >> "$GITHUB_OUTPUT"
            echo "baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "path=docs/EVAL.md" >> "$GITHUB_OUTPUT"
            echo "baseline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full evaluation (retrieval + sampled generation)
        if: github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SAMPLE: ${{ github.event.inputs.sample || '10' }}
          TRIALS: ${{ github.event.inputs.trials || '1' }}
        run: |
          python -m evaluation.evaluate \
            --all \
            --mode both \
            --agent-retrieval \
            --sample "$SAMPLE" \
            --trials "$TRIALS" \
            --report "${{ steps.report.outputs.path }}" \
            --gate \
            --gate-agent \
            --summary "$GITHUB_STEP_SUMMARY" \
            --quiet

      - name: Install Pd (headless patch tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends puredata-core

      # A new baseline changes the figures the README quotes, so the README check
      # is left to the next push; that push fails until the README is updated.
      - name: Run pytest (threshold assertions)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          BASELINE_RUN: ${{ steps.report.outputs.baseline }}
        run: |
          if [[ "$BASELINE_RUN" == "true" ]]; then
            pytest tests/ -v --deselect tests/test_readme_eval.py
          else
            pytest tests/ -v
          fi

      # Last, so a problem publishing cannot hide a test result.
      - name: Publish the report
        if: >-
          github.ref == 'refs/heads/main' && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && steps.report.outputs.baseline == 'true'))
        run: .github/scripts/publish_eval.sh "${{ steps.report.outputs.path }}"
